
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywarweb-deployment
  labels:
    app: mywarweb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mywarweb
  template:
    metadata:
      labels:
        app: mywarweb
    spec:
      containers:
        - name: mywarweb
          image: bussar/wwp:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /wwp/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /wwp/
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
# ClusterIP Service - Internal cluster access
apiVersion: v1
kind: Service
metadata:
  name: mywarweb-clusterip
spec:
  selector:
    app: mywarweb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
# NodePort Service - External access through node port
apiVersion: v1
kind: Service
metadata:
  name: mywarweb-nodeport
spec:
  selector:
    app: mywarweb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
# LoadBalancer Service - External access
apiVersion: v1
kind: Service
metadata:
  name: mywarweb-loadbalancer
spec:
  selector:
    app: mywarweb
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
---
# Ingress Resource - Host-based HTTP routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mywarweb-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: mywarweb.local
      http:
        paths:
          - path: /wwp
            pathType: Prefix
            backend:
              service:
                name: mywarweb-clusterip
                port:
                  number: 80
